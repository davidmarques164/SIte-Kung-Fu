<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrossel Kung Fu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Camadas do Fundo -->
    <div class="bg-layer base-bg"></div>
    <div class="bg-layer anim-bg"></div>

    <!-- Conteúdo em Texto -->
    <div class="content-wrapper">
      <div class="name"></div>
      <div class="des"></div>
      <a class="seeMore" target="_blank" href="#">
        <button>Acessar</button>
      </a>
    </div>

    <!-- Trilho de Miniaturas (Adicione quantas faixas quiser aqui) -->
    <div class="slide">
      <div
        class="item"
        data-name="Faixa Branca"
        data-des="O início da jornada no Kung Fu Garra de Águia."
        data-img="ChatGPT Image 18 de ago. de 2026, 09_52_53.png"
        data-link="https://seusite.com/faixa-branca"
        style="background-image: url('ChatGPT Image 18 de ago. de 2026, 09_52_53.png');"
      ></div>

      <div
        class="item"
        data-name="Faixa Amarela"
        data-des="Desenvolvimento das bases e consolidação dos movimentos fundamentais."
        data-img="ChatGPT Image 18 de ago. de 2026, 09_38_10.png"
        data-link="https://seusite.com/faixa-amarela"
        style="background-image: url('ChatGPT Image 18 de ago. de 2026, 09_38_10.png');"
      ></div>

      <div
        class="item"
        data-name="Faixa Verde"
        data-des="Refinamento técnico, velocidade e aprofundamento nos conceitos tradicionais."
        data-img="Gemini_Generated_Image_g55abxg55abxg55a.jpg"
        data-link="https://seusite.com/faixa-verde"
        style="background-image: url('Gemini_Generated_Image_g55abxg55abxg55a.jpg');"
      ></div>

      <div
        class="item"
        data-name="Faixa Vermelha"
        data-des="Domínio avançado de técnicas, precisão e espírito marcial."
        data-img="Gemini_Generated_Image_zcbv0pzcbv0pzcbv.jpg"
        data-link="https://seusite.com/faixa-vermelha"
        style="background-image: url('Gemini_Generated_Image_zcbv0pzcbv0pzcbv.jpg');"
      ></div>
    </div>

    <!-- Botões -->
    <div class="button">
      <button class="prev" type="button">◁</button>
      <button class="next" type="button">▷</button>
    </div>
  </div>

  <div class="MDJAminDiv">
    <a class="MDJAmin" href="https://github.com/MDJAmin" target="_blank">MDJAmin</a>
  </div>

  <script src="script.js"></script>
</body>
</html>
